server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${BACKEND_DB_URL:jdbc:h2:file:../storage/h2/backend;AUTO_SERVER=TRUE}
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

logging:
  level:
    root: INFO

backend:
  ragBaseUrl: ${BACKEND_RAG_BASE_URL:http://127.0.0.1:8000}
  apiKeyHeader: X-API-Key
  requestIdHeader: X-Request-ID
  tenantHeader: X-Tenant-ID

  auth:
    keys:
      - key: dev-key-1
        tenantId: tenantA
      - key: dev-key-2
        tenantId: tenantB

  http:
    timeoutMs: 60000

  ingest:
    pollIntervalMs: 1000
    maxConcurrent: 2