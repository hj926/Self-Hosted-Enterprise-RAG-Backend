services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "ollama pull nomic-embed-text &&
       ollama pull llama3.2:3b"
    environment:
      - OLLAMA_HOST=http://ollama:11434

  rag-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.rag
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - RAG_CHROMA_DIR=storage/chroma
      - RAG_REGISTRY_PATH=storage/registry.json
      - STRICT_RAG=true
    volumes:
      - ../storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - ollama-init

  backend-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    volumes:
      - ../storage:/app/storage
    ports:
      - "8080:8080"
    environment:
      - BACKEND_RAG_BASE_URL=http://rag-service:8000
      - BACKEND_DB_URL=jdbc:h2:file:/app/storage/h2/backend;AUTO_SERVER=TRUE
    depends_on:
      - rag-service
      - ollama-init

volumes:
  ollama: