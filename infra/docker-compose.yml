services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  rag-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.rag
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - RAG_CHROMA_DIR=storage/chroma
      - RAG_REGISTRY_PATH=storage/registry.json
      - STRICT_RAG=true
    volumes:
      - ../storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  backend-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      - rag-service

volumes:
  ollama:
